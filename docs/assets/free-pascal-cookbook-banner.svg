  <g transform="translate(1084 276)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 0C64 -13 82 -19 72 -33M121 0C111 -13 129 -19 119 -33M168 0C158 -13 176 -19 166 -33" fill="none" stroke="#edc782" stroke-width="3" opacity=".85"/>
    <path d="M47 32V21Q47 15 55 15H189Q197 15 197 21V32" fill="#8b6640" stroke="#e4bc77" stroke-width="2.5"/>
    <path d="M105 14Q105 3 122 3Q139 3 139 14" fill="#bd9256" stroke="#f0d08e" stroke-width="2.5"/>
