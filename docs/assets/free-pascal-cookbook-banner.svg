<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="380" viewBox="0 0 1500 380" role="img" aria-labelledby="title desc">
  <title id="title">Free Pascal Cookbook — practical recipes for Object Pascal</title>
  <desc id="desc">A closed Free Pascal cookbook sits beside a cooking pot, representing practical, tested recipes for learning Object Pascal.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17140f"/><stop offset=".55" stop-color="#222019"/><stop offset="1" stop-color="#171c2a"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a56832" stop-opacity=".28"/><stop offset="1" stop-color="#a56832" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x2="1"><stop stop-color="#f1cd83"/><stop offset="1" stop-color="#eca968"/></linearGradient>
    <linearGradient id="page" x2="1" y2="1"><stop stop-color="#fff6df"/><stop offset="1" stop-color="#e9dfc8"/></linearGradient>
    <linearGradient id="potBody" x2="0" y2="1"><stop stop-color="#675039"/><stop offset=".55" stop-color="#47382c"/><stop offset="1" stop-color="#2f2927"/></linearGradient>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31L31 0" stroke="#eacb8c" stroke-opacity=".035"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1498" height="378" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)"><path fill="url(#bg)" d="M0 0H1500V380H0z"/><ellipse cx="1120" cy="190" rx="360" ry="250" fill="url(#glow)"/><path d="M720 0H1500V380H720z" fill="url(#grain)"/></g>
  <rect x="1" y="1" width="1498" height="378" rx="24" fill="none" stroke="#544635"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="132" fill="#faf4e8" font-size="80" font-weight="700" letter-spacing="-1.5">Free Pascal</text>
    <text x="76" y="236" fill="url(#gold)" font-size="104" font-weight="700" letter-spacing="-2">Cookbook</text>
    <text x="82" y="296" fill="#edc882" font-size="30" font-weight="600">Practical recipes. Tested examples.</text>
  </g>
  <!-- The enlarged book and overlapping pot share a common baseline. -->
  <g transform="translate(870 30) scale(1.08) rotate(-5 105 135)">
    <rect x="17" y="17" width="212" height="270" rx="13" fill="#080b14" opacity=".38"/>
    <path d="M24 11Q123 3 217 19V277Q122 262 24 276Z" fill="url(#page)" stroke="#bd9a65" stroke-width="2"/>
    <path d="M43 1Q135 -7 215 11V268Q134 251 43 265Z" fill="#49311e" stroke="#e3bc76" stroke-width="3"/>
    <path d="M44 3V264" stroke="#b9884b" stroke-width="8"/>
    <path d="M58 17Q134 9 199 23V249Q134 236 58 246Z" fill="none" stroke="#c79e5f" stroke-opacity=".72" stroke-width="1.5"/>
    <g text-anchor="middle" fill="#edcf91" font-family="Cascadia Code, Consolas, monospace" font-size="21" font-weight="700">
      <text x="132" y="62">begin</text>
      <text x="132" y="88">end</text>
    </g>
    <text x="132" y="123" text-anchor="middle" fill="#f5e5c2" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.3">FREE PASCAL</text>
    <text x="132" y="149" text-anchor="middle" fill="#edc782" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">COOKBOOK</text>
    <path d="M83 171H181M83 183H169M83 195H177" stroke="#bb9660" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="132" cy="222" r="3" fill="#edc782"/><path d="M111 222H123M141 222H153" stroke="#edc782" stroke-width="1.5"/>
  </g>

  <!-- Lidded cooking pot with gentle steam -->
  <g transform="translate(1080 146) scale(1.24)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 0C64 -13 82 -19 72 -33M121 0C111 -13 129 -19 119 -33M168 0C158 -13 176 -19 166 -33" fill="none" stroke="#edc782" stroke-width="3" opacity=".85"/>
    <path d="M48 61H31Q20 61 20 72V88Q20 99 31 99H52M196 61H213Q224 61 224 72V88Q224 99 213 99H192" fill="none" stroke="#d5aa68" stroke-width="6"/>
    <path d="M43 38H201L191 126Q189 145 170 149H74Q55 145 53 126Z" fill="url(#potBody)" stroke="#e0b976" stroke-width="3"/>
