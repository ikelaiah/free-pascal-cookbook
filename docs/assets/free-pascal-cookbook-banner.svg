    <path d="M74 123Q122 133 170 123" fill="none" stroke="#bd9256" stroke-width="2" opacity=".65"/>
    <path d="M79 149V158M165 149V158M69 158H175" fill="none" stroke="#bd9256" stroke-width="4"/>

  </g>
</svg>
